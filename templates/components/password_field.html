{% load i18n %}
{# Password input with show/hide toggle. Usage: {% include "components/password_field.html" with field=form.password %} #}
<div class="field{% if field.errors %} field--invalid{% endif %}">
  <label class="field__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="password">
    <input type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
           class="input{% if field.errors %} is-invalid{% endif %}"
           autocomplete="current-password" required
           {% if field.errors %}aria-invalid="true" aria-describedby="{{ field.id_for_label }}-error"{% endif %}>
    <button type="button" class="password__toggle" data-password-toggle="{{ field.id_for_label }}"
            data-label-show="{% translate 'Show' %}" data-label-hide="{% translate 'Hide' %}"
            aria-controls="{{ field.id_for_label }}" aria-pressed="false">{% translate "Show" %}</button>
  </div>
  {% if field.errors %}<p class="field__error" id="{{ field.id_for_label }}-error">{{ field.errors|first }}</p>{% endif %}
</div>
