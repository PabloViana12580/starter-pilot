name: Bug or incident
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected, and what you saw. Never paste passwords, keys, or customers' personal data.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options: [Site down or data at risk, A feature is broken, Minor or cosmetic]
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When it started (date, time, time zone)
