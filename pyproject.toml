[project]
name = "starter-pilot"
version = "0.1.0"
description = "A throwaway project that tests the django-starter skill"
requires-python = ">=3.13"

[tool.ruff]
line-length = 130
extend-exclude = ["*/migrations/*", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106", "S311", "S603"]
"*/tests.py" = ["S105", "S106"]

[tool.ruff.format]
quote-style = "single"

[tool.coverage.run]
branch = true
source = ["."]
omit = [".venv/*", "*/migrations/*", "*/tests/*", "*/tests.py", "manage.py", "config/asgi.py", "config/wsgi.py", "gunicorn.conf.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = [".venv", "staticfiles"]
skips = ["B101"]
